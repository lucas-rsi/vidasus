<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VidaSUS – Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-page">
  <div class="login-box">
    <div class="login-brand">
      <h1>Vida<span>SUS</span></h1>
      <p>Sistema Inteligente de Agendamento<br>em Saúde Pública</p>
    </div>

    <div id="msg-erro" class="msg-erro">CPF ou senha inválidos. Tente novamente.</div>

    <form id="form-login" novalidate>
      <div class="form-group">
        <label for="cpf">CPF</label>
        <input type="text" id="cpf" placeholder="Digite seu CPF" maxlength="11" required />
      </div>
      <div class="form-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Digite sua senha" required />
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;margin-top:.5rem;padding:.65rem;">
        Entrar
      </button>
    </form>

    <p style="font-size:.75rem;color:#aaa;text-align:center;margin-top:1.2rem;">
      Cidadão: 12345678900 / 123
    </p>
    <p style="font-size:.75rem;color:#aaa;text-align:center;margin-top:1.2rem;">
      Gestor: 00000000000 / admin
    </p>
  </div>

  <script src="app.js"></script>
  <script>
    // Se já logado, redirecionar
    (function () {
      const u = getUsuario();
      if (u) window.location.href = u.tipo === 'gestor' ? 'dashboard.html' : 'agendamentos.html';
    })();

    document.getElementById('form-login').addEventListener('submit', function (e) {
      e.preventDefault();
      const cpf   = document.getElementById('cpf').value.trim();
      const senha = document.getElementById('senha').value;
      const erro  = document.getElementById('msg-erro');

      const res = login(cpf, senha);
      if (res.ok) {
        window.location.href = res.destino;
      } else {
        erro.classList.add('show');
        document.getElementById('senha').value = '';
      }
    });
  </script>
</body>
</html>
